# One-off: copies the offline packs already built in this (private) repo, e.g. pack-germany and pack-france, to the
# public repo phil07/Horizon-Maps-Releases, where the app now downloads them from. Run it from the Actions tab:
# Copy packs to public repo > Run workflow. Needs the secret RELEASES_TOKEN (Contents: Read and write on that repo).
name: Copy packs to public repo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy every pack-* release
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE: ${{ github.repository }}
          TARGET: phil07/Horizon-Maps-Releases
        run: |
          set -euo pipefail
          [ -n "$TARGET_TOKEN" ] || { echo "::error::Secret RELEASES_TOKEN is missing."; exit 1; }
          TAGS=$(GH_TOKEN="$SOURCE_TOKEN" gh release list --repo "$SOURCE" --limit 1000 --json tagName --jq '.[].tagName | select(startswith("pack-"))')
          [ -n "$TAGS" ] || { echo "No pack releases to copy."; exit 0; }
          for t in $TAGS; do
            echo "::group::$t"
            rm -rf "dl/$t"; mkdir -p "dl/$t"
            GH_TOKEN="$SOURCE_TOKEN" gh release download "$t" --repo "$SOURCE" --dir "dl/$t"
            GH_TOKEN="$TARGET_TOKEN" gh release view "$t" --repo "$TARGET" >/dev/null 2>&1 || \
              GH_TOKEN="$TARGET_TOKEN" gh release create "$t" --repo "$TARGET" --title "$t" --notes "Offline pack for Horizon Nav" --latest=false
            GH_TOKEN="$TARGET_TOKEN" gh release upload "$t" dl/"$t"/* --repo "$TARGET" --clobber
            rm -rf "dl/$t"
            echo "::endgroup::"
          done
          echo "Copied: $TAGS"
