# Builds the APK from the source code in this repository on every push to main.
# The APK appears under Actions > the run > Artifacts ("HorizonNav-apk-<number>").
# Each build is also published under Releases of the public repo phil07/Horizon-Maps-Releases as "Horizon Nav 1.0.<build>",
# and in its "app" release, which the app updates from.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the build that is still running for the older one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Uses the same signing key as the published releases, so the APK installs as an update over them.
      # Without the secrets the APK is signed with a throw-away debug key (it then has to replace, not update, an installed copy).
      - name: Restore the signing key from GitHub Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key."
            exit 0
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing.keystore"
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/signing.keystore" ~/.android/debug.keystore
          echo "Signing key restored."

      - uses: gradle/actions/setup-gradle@v4
        with:
          # the project uses Android Gradle Plugin 9.x, which needs Gradle 9
          gradle-version: "9.8.2"

      # The notes come from the "Unreleased" section of CHANGELOG.md (not from commit messages), and go into the app for its What's new card.
      - name: Prepare the release notes (and put them inside the app for its What's new card)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          # Use the first version section in CHANGELOG.md from the uploaded ZIP.
          CHANGELOG="$GITHUB_WORKSPACE/CHANGELOG.md"
          CHANGE_NOTES="$RUNNER_TEMP/horizon-change-notes.md"
          : > "$CHANGE_NOTES"
          if [ -f "$CHANGELOG" ]; then
            awk '
              /^##[[:space:]]+/ {
                if (section_found) exit
                section_found=1
                next
              }
              section_found { print }
            ' "$CHANGELOG" > "$CHANGE_NOTES"
            # Remove leading blank lines from the extracted section.
            sed -i '/./,$!d' "$CHANGE_NOTES"
          fi

          # Leave out any notes an earlier release already published, so the changelog never has to be emptied
          # by hand. If GitHub can't be asked for the old releases, the notes are used as they are.
          PUBLISHED="$RUNNER_TEMP/published-notes.txt"
          gh api "repos/phil07/Horizon-Maps-Releases/releases?per_page=100" --paginate --jq '.[].body' > "$PUBLISHED" 2>/dev/null || : > "$PUBLISHED"
          python3 - "$PUBLISHED" "$CHANGE_NOTES" <<'PY'
          import re, sys
          def key(t): return re.sub(r"[^a-z0-9]+", " ", t.lower()).strip()
          bullet = re.compile(r"\s*[-*]\s+(.*)")
          old = set()
          for line in open(sys.argv[1], encoding="utf-8", errors="ignore"):
              m = bullet.match(line)
              if m: old.add(key(m.group(1)))
          lines = [l for l in open(sys.argv[2], encoding="utf-8").read().splitlines() if l.strip()]
          out, keep = [], True
          for line in lines:
              m = bullet.match(line)
              if m: keep = key(m.group(1)) not in old
              elif line[:1].isspace(): pass   # a wrapped line goes with its bullet
              else: keep = True               # a heading: tidied below
              if keep: out.append(line)
          tidy = []
          for i, line in enumerate(out):
              if not bullet.match(line) and not line[:1].isspace():
                  nxt = next((l for l in out[i + 1:] if bullet.match(l) or not l[:1].isspace()), "")
                  if not bullet.match(nxt): continue   # a heading with nothing new under it
              tidy.append(line)
          open(sys.argv[2], "w", encoding="utf-8").write("\n".join(tidy) + ("\n" if tidy else ""))
          PY
          # The app shows these itself after updating, so the What's new card works with no connection and doesn't depend on
          # GitHub's API (which only allows a few requests an hour and often turned the card blank).
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp "$CHANGE_NOTES" "$GITHUB_WORKSPACE/app/src/main/assets/whatsnew.md"
          echo "Notes for ${VERSION}:"; cat "$CHANGE_NOTES"

      - name: Build release APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          # version 1.0.<1000 + run number>: always above the earlier releases (up to 1.0.246), so the APK installs as an update
          export BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "Building version 1.0.$BUILD_NUMBER (versionCode $((100 + BUILD_NUMBER)))"
          gradle :app:assembleRelease -PtomtomApiKey="$TOMTOM_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Every build is published: as its own release "v1.0.<build>" (shown as the latest release), and in the fixed
      # release "app", which the app's built-in update check reads (APK + .sha256 checksum + version.json).
      # Published to the public repo phil07/Horizon-Maps-Releases (this one is private, so the app couldn't reach it).
      # Needs the secret RELEASES_TOKEN: a token with "Contents: Read and write" on that repo.
      - name: Publish the APK under Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          REPO="phil07/Horizon-Maps-Releases"
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret RELEASES_TOKEN is missing: the APK was built (see Artifacts) but not published to $REPO."; exit 1; }
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          VERSION="1.0.${BUILD}"
          TAG="v${VERSION}"
          OUT=app/build/outputs/apk/release
          APK="$OUT/HorizonNav-public.apk"
          [ -f "$APK" ] || { echo "No APK was built"; exit 1; }
          (cd "$OUT" && sha256sum HorizonNav-public.apk | awk '{print $1}' > HorizonNav-public.apk.sha256)
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' "$VERSION" "$BUILD" "$((100 + BUILD))" > "$OUT/version.json"
          FILES=("$APK" "$APK.sha256" "$OUT/version.json")

          {
            echo "## Horizon Nav ${VERSION}"
            echo
            if [ -s "$CHANGE_NOTES" ]; then cat "$CHANGE_NOTES"; else echo "Built from the latest source."; fi
          } > release-notes.md

          # the version's own release (a re-run of the same build replaces its files)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$REPO" \
              --title "Horizon Nav ${VERSION}" --notes-file release-notes.md --latest
          fi

          # the fixed release the app's update check looks at
          if gh release view app --repo "$REPO" >/dev/null 2>&1; then
            gh release edit app --repo "$REPO" --title "Horizon Nav (${VERSION})" --notes-file release-notes.md --latest=false
          else
            gh release create app --repo "$REPO" \
              --title "Horizon Nav (${VERSION})" --notes-file release-notes.md --latest=false
          fi
          gh release upload app "${FILES[@]}" --repo "$REPO" --clobber

          echo "Published https://github.com/$REPO/releases/tag/$TAG"
