# Builds the APK from the source code in this repository on every push to main.
# The APK appears under Actions > the run > Artifacts ("HorizonNav-apk-<number>").
# Each build is also published under Releases as "Horizon Nav 1.0.<build>", and in the "app" release the app updates from.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the build that is still running for the older one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Uses the same signing key as the published releases, so the APK installs as an update over them.
      # Without the secrets the APK is signed with a throw-away debug key (it then has to replace, not update, an installed copy).
      - name: Restore the signing key from GitHub Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key."
            exit 0
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing.keystore"
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/signing.keystore" ~/.android/debug.keystore
          echo "Signing key restored."

      - uses: gradle/actions/setup-gradle@v4
        with:
          # the project uses Android Gradle Plugin 9.x, which needs Gradle 9
          gradle-version: "9.8.2"

      - name: Build release APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          # version 1.0.<1000 + run number>: always above the earlier releases (up to 1.0.246), so the APK installs as an update
          export BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "Building version 1.0.$BUILD_NUMBER (versionCode $((100 + BUILD_NUMBER)))"
          gradle :app:assembleRelease -PtomtomApiKey="$TOMTOM_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Every build is published: as its own release "v1.0.<build>" (shown as the latest release), and in the fixed
      # release "app", which the app's built-in update check reads (APK + .sha256 checksum + version.json).
      - name: Publish the APK under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          VERSION="1.0.${BUILD}"
          TAG="v${VERSION}"
          OUT=app/build/outputs/apk/release
          APK="$OUT/HorizonNav-public.apk"
          [ -f "$APK" ] || { echo "No APK was built"; exit 1; }
          (cd "$OUT" && sha256sum HorizonNav-public.apk | awk '{print $1}' > HorizonNav-public.apk.sha256)
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' "$VERSION" "$BUILD" "$((100 + BUILD))" > "$OUT/version.json"
          FILES=("$APK" "$APK.sha256" "$OUT/version.json")

          {
            echo "## Horizon Nav ${VERSION}"
            echo
            git log -1 --format='%s%n%n%b' | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo "### Downloads"
            echo "- **HorizonNav-public.apk**: the app to install"
            echo "- **HorizonNav-public.apk.sha256**: SHA-256 checksum"
            echo "- **version.json**: version information for the updater"
          } > release-notes.md

          # the version's own release (a re-run of the same build replaces its files)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Horizon Nav ${VERSION}" --notes-file release-notes.md --latest
          fi

          # the fixed release the app's update check looks at
          if gh release view app --repo "$REPO" >/dev/null 2>&1; then
            gh release edit app --repo "$REPO" --title "Horizon Nav (${VERSION})" --notes-file release-notes.md --latest=false
          else
            gh release create app --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Horizon Nav (${VERSION})" --notes-file release-notes.md --latest=false
          fi
          gh release upload app "${FILES[@]}" --repo "$REPO" --clobber

          echo "Published https://github.com/$REPO/releases/tag/$TAG"
