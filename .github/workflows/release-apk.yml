name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Release-APK bauen
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: gradle assembleRelease -PtomtomApiKey="$TOMTOM_API_KEY"

      - name: APK an Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-nav-apk
          path: app/build/outputs/apk/release/*.apk
