# Builds offline packs (routing, map, search lists) for any country, US state or Canadian province, from the free OpenStreetMap
# extracts on download.geofabrik.de, and publishes each as a GitHub release the app downloads from, in this repo (phil07/Horizon-Maps, public).
#
# Run it from the Actions tab: Build country packs > Run workflow, and type the areas as Geofabrik paths, separated by commas, e.g.
#   europe/france, europe/germany, north-america/us/california, north-america/canada/ontario, south-america/brazil
# (the path is the part of the Geofabrik download link between "download.geofabrik.de/" and "-latest.osm.pbf").
#
# Each area becomes the release "pack-<name>", with the continent left off: europe/france -> pack-france,
# north-america/us/georgia -> pack-us-georgia. The app uses the same rule, so a pack appears in it as soon as its build finishes.
# Mode "extras only" just adds the speed limit and speed camera files to areas that are already built (minutes per area instead
# of hours): use it to give older packs offline speed limits. The UK packs (built in HeadUnitOrbis) get theirs here too: type
# "ew" (England & Wales) or "gb" (Great Britain) as the area, and their extras go in this repo's releases pack-ew and pack-gb.
# Up to 320 areas can go in one run. Every area is built as three jobs side by side (routing, map, search lists), so even big countries stay under GitHub's 6-hour limit.
name: Build country packs
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik areas, comma separated (e.g. europe/france, north-america/us/texas)"
        required: true
        default: "europe/france"
      mode:
        description: "full = build everything; extras only = just add speed limits and cameras to packs already built"
        type: choice
        options: ["full", "extras only"]
        default: "full"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    # GitHub allows at most 256 jobs per list, and every area is 3 jobs, so the areas are shared out over up to four lists of 80
    outputs:
      a1: ${{ steps.plan.outputs.a1 }}
      a2: ${{ steps.plan.outputs.a2 }}
      a3: ${{ steps.plan.outputs.a3 }}
      a4: ${{ steps.plan.outputs.a4 }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Work out the release names and create the releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REGIONS: ${{ inputs.regions }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY' > areas.json
          import json, os
          out = []
          for p in os.environ["REGIONS"].replace("\n", ",").split(","):
              p = p.strip().strip("/")
              if not p: continue
              if p.endswith("-latest.osm.pbf"): p = p[:-len("-latest.osm.pbf")]
              p = p.replace("https://download.geofabrik.de/", "")
              # the UK packs from HeadUnitOrbis: their extras are built from the Great Britain extract
              if p.lower() in ("ew", "gb"):
                  out.append({"path": "europe/great-britain", "tag": "pack-" + p.lower()}); continue
              parts = p.split("/")
              tag = "pack-" + "-".join(parts[1:] if len(parts) > 1 else parts)
              out.append({"path": p, "tag": tag})
          print(json.dumps(out))
          PY
          cat areas.json
          for t in $(python3 -c "import json;print(' '.join(a['tag'] for a in json.load(open('areas.json'))))"); do
            gh release create "$t" --repo "phil07/Horizon-Maps" --title "$t" --notes "Offline pack for Horizon Nav" 2>/dev/null || echo "$t already exists"
          done
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a = json.load(open("areas.json"))
          if len(a) > 320: raise SystemExit("Too many areas in one run (%d): the most is 320" % len(a))
          for i in range(4):
              print("a%d=%s" % (i + 1, json.dumps(a[i * 80:(i + 1) * 80])))
          import os
          print("parts=%s" % json.dumps(["extras"] if os.environ.get("MODE") == "extras only" else ["routing", "map", "lists"]))
          PY

  # The map jobs all need the same 750 MB water-polygons file from osmdata.openstreetmap.de. Sixteen jobs asking that server at once
  # got no answer ("HTTP connect timed out"), so one job fetches it (patiently) and keeps it as a file of the release "map-sources"
  # in this repo, which GitHub's runners reach without trouble; the map jobs take it from there. It never fails the run: without
  # the file the map jobs try the server themselves.
  water:
    needs: plan
    if: ${{ github.event.inputs.mode != 'extras only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Water polygons into the release map-sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=water-polygons-split-3857.zip
          REPO="${{ github.repository }}"
          if gh release view map-sources --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$A"; then echo "Already in the release map-sources"; exit 0; fi
          ok=""
          for try in $(seq 1 15); do
            echo "Downloading from osmdata.openstreetmap.de (try $try)"
            if curl -fL --connect-timeout 30 --max-time 1500 -A "HorizonNav-pack-builder" -o "$A" "https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip" \
               && [ "$(stat -c%s "$A")" -gt 100000000 ]; then ok=1; break; fi
            rm -f "$A"
            sleep $(( 60 * try ))
          done
          [ -n "$ok" ] || { echo "No answer from the server: the map jobs will try on their own"; exit 0; }
          gh release view map-sources --repo "$REPO" >/dev/null 2>&1 || gh release create map-sources --repo "$REPO" --title "Map sources" \
            --notes "Source files for building the offline maps (water polygons from osmdata.openstreetmap.de). Not an app release." --prerelease --latest=false
          gh release upload map-sources "$A" --repo "$REPO" --clobber
          echo "Uploaded"

  build1:
    needs: [plan, water]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.a1 != '[]' }}
    uses: ./.github/workflows/build-country-packs-group.yml
    with:
      areas: ${{ needs.plan.outputs.a1 }}
      parts: ${{ needs.plan.outputs.parts }}

  build2:
    needs: [plan, water]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.a2 != '[]' }}
    uses: ./.github/workflows/build-country-packs-group.yml
    with:
      areas: ${{ needs.plan.outputs.a2 }}
      parts: ${{ needs.plan.outputs.parts }}

  build3:
    needs: [plan, water]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.a3 != '[]' }}
    uses: ./.github/workflows/build-country-packs-group.yml
    with:
      areas: ${{ needs.plan.outputs.a3 }}
      parts: ${{ needs.plan.outputs.parts }}

  build4:
    needs: [plan, water]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.a4 != '[]' }}
    uses: ./.github/workflows/build-country-packs-group.yml
    with:
      areas: ${{ needs.plan.outputs.a4 }}
      parts: ${{ needs.plan.outputs.parts }}

